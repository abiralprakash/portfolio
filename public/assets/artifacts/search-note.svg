<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none" role="img" aria-labelledby="t">
  <title id="t">Exact vs fuzzy matching notebook note</title>
  <rect width="720" height="380" fill="#F7F4EF"/>
  <rect x="48" y="32" width="624" height="316" fill="#FFFEFA" stroke="#D4CBBE"/>
  <line x1="120" y1="32" x2="120" y2="348" stroke="#E8A0A0" stroke-width="1"/>
  <text x="140" y="70" fill="#6B7684" font-family="Georgia, serif" font-style="italic" font-size="15">Production note  register search</text>
  <text x="140" y="110" fill="#0B1520" font-family="Georgia, serif" font-size="17">I believed fuzzy matching would help.</text>
  <text x="140" y="140" fill="#0B1520" font-family="Georgia, serif" font-size="17">It did  until ambiguity showed up mid-call.</text>
  <text x="140" y="180" fill="#0A3A5C" font-family="Georgia, serif" font-style="italic" font-size="18">Exact-first. Normalize hard. Expand later.</text>
  <text x="140" y="230" fill="#3A4654" font-family="system-ui,sans-serif" font-size="13">Latency: fuzzy prototypes routinely &gt; 2s at 130K+</text>
  <text x="140" y="254" fill="#3A4654" font-family="system-ui,sans-serif" font-size="13">Trust: a false conflict is worse than a missed suggestion</text>
  <text x="140" y="290" fill="#C45C26" font-family="system-ui,sans-serif" font-size="12" font-weight="600">CHANGED MY MIND · 2025</text>
  <text x="140" y="330" fill="#8A94A1" font-family="system-ui,sans-serif" font-size="11">Artifact · decision residue, not a screenshot</text>
</svg>
